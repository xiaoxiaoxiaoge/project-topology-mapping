name: Feature Request
description: Suggest a new feature
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      content: |
        Thanks for suggesting a feature! Please describe the problem and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like the feature to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: A concrete example of when this would be used
    validations:
      required: true

  - type: dropdown
    id: willingness
    attributes:
      label: Are you willing to implement this?
      options:
        - Yes, I can submit a PR
        - Yes, with guidance
        - No, hoping maintainer will
        - Unsure
    validations:
      required: true
