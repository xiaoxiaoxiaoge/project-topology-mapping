name: Bug Report
description: Report a bug to help us improve
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      content: |
        Thanks for reporting a bug! Please fill out the template below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Screenshots

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows (Git Bash)
        - Windows (WSL)
        - Windows (PowerShell)
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
    validations:
      required: true

  - type: input
    id: skill-version
    attributes:
      label: Skill Version
    validations:
      required: true

  - type: dropdown
    id: project-type
    attributes:
      label: Scanned Project Type
      options:
        - Frontend (React/Vue/Angular)
        - Backend (Java/Go/Python/Node/.NET/Rust)
        - Full-stack
        - Mobile (Android/iOS/RN/Flutter)
        - Mini Program
        - Desktop (Electron/Tauri)
        - HarmonyOS
        - Mixed
        - Other
    validations:
      required: true
